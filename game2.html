<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Precision Archery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 100%;
            max-height: 100vh;
            overflow: hidden;
        }

        /* Vertical layout for mobile */
        @media (orientation: portrait) {
            #gameContainer {
                display: flex;
                flex-direction: column;
            }
            
            #arena {
                flex-grow: 1;
                width: 100%;
                height: 70vh;
            }
            
            #controls {
                flex-shrink: 0;
                height: 30vh;
                flex-direction: column;
                justify-content: space-around;
                padding: 10px;
            }
            
            #controls button {
                width: 100%;
                max-width: none;
                margin: 5px 0;
            }
            
            #target {
                right: 50%;
                transform: translateX(50%) translateY(-50%);
                top: 20%;
            }
            
            #shootingLine {
                left: 50%;
                transform: translateX(-50%);
                height: 70vh;
                top: 0;
            }
            
            #shootingSpot {
                left: 50%;
                transform: translateX(-50%) translateY(-50%);
                top: 80%;
            }
            
            #arrow {
                left: 50%;
                transform: translateX(-50%) translateY(-50%) rotate(90deg);
                transform-origin: center;
            }
            
            .arrow {
                transform-origin: center !important;
            }
            
            #scoreboard, #windIndicator, #difficulty {
                font-size: 16px;
                padding: 8px 12px;
            }
            
            #alignmentFeedback {
                left: 50%;
                transform: translateX(-50%) translateY(-50%);
                top: 50%;
                font-size: 18px;
            }
        }

        #arena {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1a2e 0%, #16213e 100%);
            position: relative;
            overflow: hidden;
        }

        #shootingLine {
            position: absolute;
            width: 2px;
            background: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 10px cyan;
        }

        #shootingSpot {
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            border: 2px solid cyan;
            box-shadow: 0 0 10px cyan;
        }

        #target {
            position: absolute;
            width: 120px;
            height: 120px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><circle cx="60" cy="60" r="60" fill="none" stroke="magenta" stroke-width="3"/><circle cx="60" cy="60" r="50" fill="none" stroke="yellow" stroke-width="3"/><circle cx="60" cy="60" r="40" fill="none" stroke="cyan" stroke-width="3"/><circle cx="60" cy="60" r="30" fill="none" stroke="lime" stroke-width="3"/><circle cx="60" cy="60" r="20" fill="none" stroke="red" stroke-width="3"/><circle cx="60" cy="60" r="10" fill="red"/></svg>') no-repeat;
            filter: drop-shadow(0 0 15px magenta);
            transition: left 0.1s linear;
        }

        #arrow {
            position: absolute;
            width: 80px;
            height: 10px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 10"><polygon points="0,5 10,0 10,10" fill="white"/><rect x="10" y="3" width="65" height="4" fill="silver"/><polygon points="75,5 80,0 80,10" fill="red"/></svg>') no-repeat;
            display: none;
            z-index: 5;
        }

        .hitMarker {
            position: absolute;
            width: 20px;
            height: 20px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="gold" stroke-width="2"/><path d="M5,5 L15,15 M15,5 L5,15" stroke="gold" stroke-width="2"/></svg>') no-repeat;
            animation: hitPulse 0.5s forwards;
        }

        @keyframes hitPulse {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        #scoreboard {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px solid cyan;
            font-size: 18px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        #controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            z-index: 10;
        }

        button {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 198, 255, 0.5);
            transition: all 0.3s;
            font-weight: bold;
            max-width: 200px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 198, 255, 0.8);
        }

        button:disabled {
            background: linear-gradient(45deg, #555, #333);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        #windIndicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px solid magenta;
            font-size: 16px;
            z-index: 10;
        }

        #difficulty {
            position: absolute;
            top: 60px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px solid lime;
            font-size: 16px;
            z-index: 10;
        }

        #alignmentFeedback {
            position: absolute;
            font-size: 20px;
            color: cyan;
            text-shadow: 0 0 10px cyan;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="arena">
            <div id="shootingLine"></div>
            <div id="shootingSpot"></div>
            <div id="target"></div>
            <div id="arrow"></div>
            <div id="scoreboard">
                <div>Score: <span id="score">0</span></div>
                <div>Streak: <span id="streak">0</span>x</div>
            </div>
            <div id="windIndicator">Wind: 0 m/s</div>
            <div id="difficulty">Difficulty: Medium</div>
            <div id="alignmentFeedback">ALIGNED!</div>
        </div>
        <div id="controls">
            <button id="shootBtn">Shoot Arrow</button>
            <button id="difficultyBtn">Change Difficulty</button>
            <button id="windBtn">Toggle Wind</button>
        </div>
    </div>

    <script>
        // Game variables
        let score = 0;
        let streak = 0;
        let targetX = 0;
        let targetDirection = 1;
        let targetSpeed = 3;
        let difficulty = 1; // 0=easy, 1=medium, 2=hard
        let windEnabled = false;
        let windSpeed = 0;
        let gameInterval;
        let alignmentFeedbackTimeout;
        let isAligned = false;
        let animationId;
        let arrows = [];
        let isMobile = false;

        // DOM elements
        const arena = document.getElementById('arena');
        const target = document.getElementById('target');
        const shootingLine = document.getElementById('shootingLine');
        const shootingSpot = document.getElementById('shootingSpot');
        const scoreDisplay = document.getElementById('score');
        const streakDisplay = document.getElementById('streak');
        const shootBtn = document.getElementById('shootBtn');
        const difficultyBtn = document.getElementById('difficultyBtn');
        const windBtn = document.getElementById('windBtn');
        const windIndicator = document.getElementById('windIndicator');
        const difficultyDisplay = document.getElementById('difficulty');
        const alignmentFeedback = document.getElementById('alignmentFeedback');

        // Check if mobile device
        function checkMobile() {
            isMobile = window.matchMedia("(orientation: portrait)").matches;
            setupGameLayout();
        }

        // Set up game layout based on orientation
        function setupGameLayout() {
            const arenaWidth = arena.offsetWidth;
            const arenaHeight = arena.offsetHeight;
            
            if (isMobile) {
                // Vertical layout (mobile)
                shootingLine.style.height = `${arenaHeight * 0.7}px`;
                shootingLine.style.left = `${arenaWidth / 2}px`;
                shootingLine.style.top = '0';
                
                shootingSpot.style.left = `${arenaWidth / 2}px`;
                shootingSpot.style.top = `${arenaHeight * 0.8}px`;
                
                target.style.top = '20%';
                target.style.left = '50%';
            } else {
                // Horizontal layout (desktop)
                shootingLine.style.width = '2px';
                shootingLine.style.height = `${arenaHeight}px`;
                shootingLine.style.left = '100px';
                shootingLine.style.top = '0';
                
                shootingSpot.style.left = '90px';
                shootingSpot.style.top = '50%';
                
                target.style.top = '50%';
                target.style.right = '50px';
                target.style.left = 'auto';
            }
        }

        // Initialize game
        function initGame() {
            checkMobile();
            window.addEventListener('resize', setupGameLayout);
            
            score = 0;
            streak = 0;
            updateDisplays();
            
            // Set up game loop
            gameLoop();
            
            // Set up event listeners
            shootBtn.addEventListener('click', shootArrow);
            difficultyBtn.addEventListener('click', changeDifficulty);
            windBtn.addEventListener('click', toggleWind);
            
            // Initial target position
            updateTargetPosition();
        }

        // Game loop
        function gameLoop() {
            // Move target
            moveTarget();
            
            // Check alignment with shooting spot
            checkAlignment();
            
            // Update all active arrows
            updateArrows();
            
            // Update wind if enabled
            if (windEnabled) {
                windSpeed += (Math.random() - 0.5) * 0.5;
                windSpeed = Math.max(-10, Math.min(10, windSpeed));
                windIndicator.textContent = `Wind: ${windSpeed.toFixed(1)} m/s`;
            }
            
            animationId = requestAnimationFrame(gameLoop);
        }

        // Check if target is aligned with shooting spot
        function checkAlignment() {
            const targetRect = target.getBoundingClientRect();
            const shootingSpotRect = shootingSpot.getBoundingClientRect();
            
            const alignmentThreshold = 5;
            
            if (isMobile) {
                // Check vertical alignment for mobile
                const targetCenterX = targetRect.left + targetRect.width / 2;
                const shootingSpotCenterX = shootingSpotRect.left + shootingSpotRect.width / 2;
                isAligned = Math.abs(targetCenterX - shootingSpotCenterX) < alignmentThreshold;
            } else {
                // Check horizontal alignment for desktop
                const targetCenterY = targetRect.top + targetRect.height / 2;
                const shootingSpotCenterY = shootingSpotRect.top + shootingSpotRect.height / 2;
                isAligned = Math.abs(targetCenterY - shootingSpotCenterY) < alignmentThreshold;
            }
            
            if (isAligned) {
                alignmentFeedback.style.opacity = '1';
                target.style.filter = 'drop-shadow(0 0 20px magenta) brightness(1.5)';
                if (alignmentFeedbackTimeout) clearTimeout(alignmentFeedbackTimeout);
            } else {
                alignmentFeedback.style.opacity = '0';
                target.style.filter = 'drop-shadow(0 0 15px magenta)';
            }
        }

        // Move target
        function moveTarget() {
            const arenaRect = arena.getBoundingClientRect();
            const targetRect = target.getBoundingClientRect();
            
            if (isMobile) {
                // Move horizontally for mobile
                const maxX = arenaRect.width - targetRect.width - 20;
                targetX += targetDirection * targetSpeed;
                
                if (targetX <= 20) {
                    targetX = 20;
                    targetDirection = 1;
                } else if (targetX >= maxX) {
                    targetX = maxX;
                    targetDirection = -1;
                }
                
                target.style.left = `calc(50% + ${targetX - arenaRect.width/2 + targetRect.width/2}px)`;
            } else {
                // Move vertically for desktop
                const maxY = arenaRect.height - targetRect.height - 20;
                targetX += targetDirection * targetSpeed;
                
                if (targetX <= 20) {
                    targetX = 20;
                    targetDirection = 1;
                } else if (targetX >= maxY) {
                    targetX = maxY;
                    targetDirection = -1;
                }
                
                target.style.top = `${targetX}px`;
            }
        }

        // Shoot arrow
        function shootArrow() {
            if (shootBtn.disabled) return;
            
            const arrow = document.createElement('div');
            arrow.className = 'arrow';
            arrow.style.cssText = `
                position: absolute;
                width: 80px;
                height: 10px;
                background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 10"><polygon points="0,5 10,0 10,10" fill="white"/><rect x="10" y="3" width="65" height="4" fill="silver"/><polygon points="75,5 80,0 80,10" fill="red"/></svg>') no-repeat;
                z-index: 5;
            `;
            
            if (isMobile) {
                arrow.style.left = `${arena.offsetWidth / 2}px`;
                arrow.style.top = `${arena.offsetHeight * 0.8}px`;
                arrow.style.transform = 'rotate(90deg)';
                arrow.style.transformOrigin = 'center';
            } else {
                arrow.style.left = '100px';
                arrow.style.top = '50%';
            }
            
            arena.appendChild(arrow);
            
            const shootingSpotRect = shootingSpot.getBoundingClientRect();
            const arenaRect = arena.getBoundingClientRect();
            
            arrows.push({
                element: arrow,
                x: isMobile ? arena.offsetWidth / 2 : 100,
                y: isMobile ? arena.offsetHeight * 0.8 : shootingSpotRect.top - arenaRect.top + shootingSpotRect.height / 2,
                startTime: Date.now(),
                startX: isMobile ? arena.offsetWidth / 2 : 100,
                startY: isMobile ? arena.offsetHeight * 0.8 : shootingSpotRect.top - arenaRect.top + shootingSpotRect.height / 2,
                windEffect: windEnabled ? windSpeed * 2 : 0
            });
            
            shootBtn.disabled = true;
            setTimeout(() => {
                shootBtn.disabled = false;
            }, 300);
        }

        // Update all active arrows
        function updateArrows() {
            const arenaRect = arena.getBoundingClientRect();
            const targetRect = target.getBoundingClientRect();
            const targetCenter = {
                x: targetRect.left - arenaRect.left + targetRect.width / 2,
                y: targetRect.top - arenaRect.top + targetRect.height / 2
            };
            
            for (let i = arrows.length - 1; i >= 0; i--) {
                const arrow = arrows[i];
                const elapsed = Date.now() - arrow.startTime;
                const progress = Math.min(elapsed / 500, 1);
                
                if (isMobile) {
                    // Vertical arrow movement for mobile
                    arrow.y = arrow.startY - (arrow.startY - 20) * progress;
                    arrow.x = arrow.startX + arrow.windEffect * progress * 100;
                    
                    const angle = Math.atan2(
                        arrow.windEffect * progress * 100,
                        (arrow.startY - 20) * progress
                    ) * (180 / Math.PI) + 90;
                    
                    arrow.element.style.left = `${arrow.x}px`;
                    arrow.element.style.top = `${arrow.y}px`;
                    arrow.element.style.transform = `rotate(${angle}deg)`;
                } else {
                    // Horizontal arrow movement for desktop
                    arrow.x = arrow.startX + (arenaRect.width - 150) * progress;
                    arrow.y = arrow.startY + arrow.windEffect * progress * 100;
                    
                    const angle = Math.atan2(
                        arrow.windEffect * progress * 100,
                        (arenaRect.width - 150) * progress
                    ) * (180 / Math.PI);
                    
                    arrow.element.style.left = `${arrow.x}px`;
                    arrow.element.style.top = `${arrow.y}px`;
                    arrow.element.style.transform = `translateY(-50%) rotate(${angle}deg)`;
                }
                
                // Check for hit
                if (progress >= 1) {
                    const distance = Math.sqrt(
                        Math.pow(arrow.x - targetCenter.x, 2) +
                        Math.pow(arrow.y - targetCenter.y, 2)
                    );
                    
                    if (distance <= 60) {
                        const ring = Math.min(5, Math.floor(distance / 10));
                        let points = 10 - ring * 2;
                        
                        if (isAligned && ring <= 1) points *= 2;
                        
                        score += points;
                        streak++;
                        createHitMarker(arrow.x, arrow.y);
                    } else {
                        streak = 0;
                    }
                    
                    updateDisplays();
                    arrow.element.remove();
                    arrows.splice(i, 1);
                }
            }
        }

        function createHitMarker(x, y) {
            const marker = document.createElement('div');
            marker.className = 'hitMarker';
            marker.style.left = `${x - 10}px`;
            marker.style.top = `${y - 10}px`;
            arena.appendChild(marker);
            
            setTimeout(() => {
                arena.removeChild(marker);
            }, 1000);
        }

        function updateDisplays() {
            scoreDisplay.textContent = score;
            streakDisplay.textContent = streak;
            
            if (streak >= 5) {
                streakDisplay.style.color = 'gold';
                streakDisplay.style.textShadow = '0 0 10px gold';
            } else if (streak >= 3) {
                streakDisplay.style.color = 'cyan';
                streakDisplay.style.textShadow = '0 0 10px cyan';
            } else {
                streakDisplay.style.color = 'white';
                streakDisplay.style.textShadow = 'none';
            }
        }

        function changeDifficulty() {
            difficulty = (difficulty + 1) % 3;
            
            switch (difficulty) {
                case 0: targetSpeed = 1.5; difficultyDisplay.textContent = "Easy"; break;
                case 1: targetSpeed = 3; difficultyDisplay.textContent = "Medium"; break;
                case 2: targetSpeed = 5; difficultyDisplay.textContent = "Hard"; break;
            }
        }

        function toggleWind() {
            windEnabled = !windEnabled;
            
            if (windEnabled) {
                windSpeed = (Math.random() - 0.5) * 6;
                windBtn.textContent = "Disable Wind";
                windIndicator.style.display = "block";
            } else {
                windSpeed = 0;
                windBtn.textContent = "Enable Wind";
                windIndicator.style.display = "none";
            }
        }

        // Start the game
        window.onload = initGame;
    </script>
</body>
</html>
