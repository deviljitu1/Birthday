<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Manas!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 800px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(78,205,196,0.1) 0%, rgba(255,255,255,0) 70%);
            z-index: -1;
            animation: rotate 20s linear infinite;
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: 700;
            position: relative;
            display: inline-block;
        }
        
        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, #4ecdc4, #556270);
            border-radius: 2px;
        }
        
        .photo-crop {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            margin: 0 auto 25px;
            border: 5px solid white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
        }
        
        .photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .photo-crop:hover .photo {
            transform: scale(1.05);
        }
        
        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
            flex-wrap: wrap;
        }
        
        .countdown-item {
            background: linear-gradient(135deg, #556270 0%, #4ecdc4 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            min-width: 80px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .countdown-number {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1;
        }
        
        .countdown-label {
            font-size: 0.8rem;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .message {
            background-color: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin: 25px 0;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #555;
            border-left: 4px solid #4ecdc4;
        }
        
        .message b {
            color: #333;
            display: block;
            margin-top: 15px;
        }
        
        #play-game-link {
            margin-top: 30px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .game-btn {
            display: inline-block;
            padding: 12px 28px;
            font-size: 1.1rem;
            border-radius: 50px;
            background: linear-gradient(135deg, #4ecdc4 0%, #556270 100%);
            color: white;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        
        .game-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        .balloon {
            position: absolute;
            width: 40px;
            height: 50px;
            background-color: rgba(255, 0, 0, 0.7);
            border-radius: 50%;
            z-index: 1;
            animation: float 8s ease-in infinite;
            bottom: -50px;
        }
        
        .balloon::before {
            content: '';
            position: absolute;
            width: 1px;
            height: 60px;
            background-color: rgba(0,0,0,0.2);
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .balloon::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 8px;
            background-color: rgba(0,0,0,0.2);
            bottom: -68px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 50%;
        }
        
        @keyframes float {
            0% {
                transform: translateX(0) translateY(0) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: translateX(50px) translateY(-100px) rotate(10deg);
            }
            100% {
                transform: translateX(100px) translateY(-100vh) rotate(20deg);
                opacity: 0;
            }
        }
        .confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                border-radius: 15px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .photo-crop {
                width: 150px;
                height: 150px;
            }
            
            .countdown-item {
                min-width: 70px;
                padding: 10px;
            }
            
            .countdown-number {
                font-size: 1.5rem;
            }
            
            .message {
                font-size: 1rem;
                padding: 15px;
            }
            
            .game-btn {
                padding: 10px 20px;
                font-size: 1rem;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .photo-crop {
                width: 120px;
                height: 120px;
            }
            
            .countdown {
                gap: 10px;
            }
            
            .countdown-item {
                min-width: 60px;
                font-size: 0.9rem;
            }
            
            .countdown-number {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="photo-crop" id="photo-crop">
            <img src="WhatsApp Image 2025-07-02 at 17.18.20_8cc0655c.jpg" alt="Manas's Photo" class="photo">
        </div>
        <h1>Happy Birthday, Manas! 🎉</h1>
        <div class="countdown" id="countdown">
            <div class="countdown-item">
                <div class="countdown-number" id="days">00</div>
                <div class="countdown-label">Days</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="hours">00</div>
                <div class="countdown-label">Hours</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="minutes">00</div>
                <div class="countdown-label">Minutes</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="seconds">00</div>
                <div class="countdown-label">Seconds</div>
            </div>
        </div>
        <div class="message">
            Wishing you an amazing birthday, Manas!<br>
            May your year be filled with creativity, joy, and awesome video edits!<br>
            <b>From your friend :)</b>
        </div>
        <div id="play-game-link">
            <a href="game2.html" class="game-btn">🎮 Play Birthday Game</a>
        </div>
    </div>
    
    <canvas class="confetti" id="confetti-canvas"></canvas>
    <audio id="birthday-audio" src="Birthday Song.mp3" preload="auto"></audio>
    
    <script>
       // Create balloons - updated version
        function createBalloons() {
            const colors = ['#ff6b6b', '#4ecdc4', '#ffbe76', '#576574', '#f368e0', '#ff9ff3', '#feca57', '#ff9f43'];
            
            for (let i = 0; i < 20; i++) {
                const balloon = document.createElement('div');
                balloon.className = 'balloon';
                
                // Random positioning
                balloon.style.left = Math.random() * 100 + 'vw';
                
                // Random properties
                balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                balloon.style.width = (30 + Math.random() * 30) + 'px';
                balloon.style.height = (40 + Math.random() * 40) + 'px';
                balloon.style.opacity = 0.7 + Math.random() * 0.3;
                
                // Random animation
                const duration = 6 + Math.random() * 12;
                balloon.style.animation = `float ${duration}s ease-in infinite`;
                balloon.style.animationDelay = Math.random() * 5 + 's';
                
                // Random horizontal movement
                const keyframes = `
                    @keyframes float-${i} {
                        0% {
                            transform: translateX(${Math.random() * 20 - 10}px) translateY(0) rotate(0deg);
                            opacity: 1;
                        }
                        50% {
                            transform: translateX(${Math.random() * 100 - 50}px) translateY(-50vh) rotate(${Math.random() * 30 - 15}deg);
                        }
                        100% {
                            transform: translateX(${Math.random() * 100 - 50}px) translateY(-100vh) rotate(${Math.random() * 30 - 15}deg);
                            opacity: 0;
                        }
                    }
                `;
                
                const style = document.createElement('style');
                style.innerHTML = keyframes;
                document.head.appendChild(style);
                
                balloon.style.animationName = `float-${i}`;
                
                document.body.appendChild(balloon);
            }
        }
        
        // Countdown timer
        function updateCountdown() {
            // Set the birthday date (July 2nd)
            const now = new Date();
            let birthday = new Date(now.getFullYear(), 6, 14); // Month is 0-indexed (6 = July)
            
            // If birthday has passed this year, set for next year
            if (now > birthday) {
                birthday = new Date(now.getFullYear() + 1, 6, 14);
            }
            
            const diff = birthday - now;
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('days').textContent = days.toString().padStart(2, '0');
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
            
            // If it's the birthday, show celebration
            if (days === 0 && hours === 0 && minutes === 0 && seconds === 0) {
                celebrateBirthday();
            }
        }
        
        // Birthday celebration
        function celebrateBirthday() {
            // Show the game link
            document.getElementById('play-game-link').style.display = 'block';
            
            // Play audio
            const audio = document.getElementById('birthday-audio');
            audio.loop = true;
            audio.play().catch(e => console.log("Audio play failed:", e));
            
            // Start confetti
            startConfetti();
        }
        
        // Confetti effect
        function startConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const ctx = canvas.getContext('2d');
            const pieces = [];
            const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4CAF50', '#8BC34A', '#CDDC39', '#FFEB3B', '#FFC107', '#FF9800', '#FF5722'];
            
            for (let i = 0; i < 150; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 4 + 1,
                    d: Math.random() * 15 + 10,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngle: Math.random() * 0.1,
                    tiltAngleIncrement: Math.random() * 0.07
                });
            }
            
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                pieces.forEach(p => {
                    ctx.beginPath();
                    ctx.lineWidth = p.r / 2;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + (p.r / 4), p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + (p.r / 4));
                    ctx.stroke();
                    
                    p.tiltAngle += p.tiltAngleIncrement;
                    p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
                    p.tilt = Math.sin(p.tiltAngle) * 15;
                    
                    if (p.y > canvas.height) {
                        p.x = Math.random() * canvas.width;
                        p.y = -10;
                    }
                });
                
                requestAnimationFrame(draw);
            }
            
            draw();
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            createBalloons();
            updateCountdown();
            setInterval(updateCountdown, 1000);
            
            // Check if it's birthday on load
            const now = new Date();
            const birthday = new Date(now.getFullYear(), 6, 2); // July 2nd
            if (now.getMonth() === birthday.getMonth() && now.getDate() === birthday.getDate()) {
                celebrateBirthday();
            }
        });
        
        // Make responsive on resize
        window.addEventListener('resize', function() {
            const canvas = document.getElementById('confetti-canvas');
            if (canvas) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        });
    </script>
</body>
</html>
